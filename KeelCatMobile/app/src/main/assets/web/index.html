    <script>
      // Apply saved theme + skin before paint to avoid a flash of the wrong style.
      (function () {
        try {
          var t = localStorage.getItem("apisteward.theme") || "dark";
          var s = localStorage.getItem("apisteward.skin") || "skeuo";
          var el = document.documentElement;
          el.dataset.theme = t;
          el.dataset.skin = s;
          el.classList.toggle("dark", t === "dark");
          el.style.background =
            s === "skeuo"
              ? t === "light" ? "#d8d5cd" : "#181a1e"
              : t === "light" ? "#f6f7f9" : "#06070a";
        } catch (e) {}
      })();
    </script>
